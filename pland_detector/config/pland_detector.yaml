enable_detection: true
publish_debug_image: true
gimbal_in_degrees: true
velocity_deadzone: 0.2
enable_c2f_enhancement: true
disable_all_enhancement: false # 总开关: 置 true 关闭全部增强 (含粗检ROI/超分锐化/CLAHE), 灰度直通
enhance_mode: adaptive # 增强模式: none(直通) / sharpen(全图锐化) / roi(全高度ROI超分) / adaptive(高度自适应C2F, 部署默认)
