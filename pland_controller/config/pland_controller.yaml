# ============ 融合高度切换阈值 (测距仪 vs rel_alt/里程计) ============
# base_z 低于 min 纯用测距仪 (含机架高度补偿), 高于 max 纯用 rel_alt/里程计,
# 中间线性过渡。min 需覆盖 rel_alt 气压零偏 (实测约 +1.4m)
fusion_min_alt: 3.0
fusion_max_alt: 5.0
use_disarm: true
use_ff_vel: true
baseline_mode: false
target_timeout: 1
target_distance: 3
target_distance_hysteresis: 1
yaw_ff_tau: 0.8
